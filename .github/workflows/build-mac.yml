# Gera o instalável .dmg do Alpha Compare NA NUVEM, em x64 (Intel) — que roda em TODOS os Macs
# (Intel 2014/2018 nativo + Apple Silicon via Rosetta). Os runners macOS Intel (macos-13) foram
# aposentados pelo GitHub, então compilamos x64 NO runner arm64 (macos-14) usando Rosetta:
# congelamos o OCR com um Python x86_64 (Miniforge) e empacotamos com electron-builder --x64.
# Dispara: manual ("Run workflow") OU push de uma tag "mac-v*".
name: Build Mac DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-v*'

jobs:
  build:
    name: DMG x64 (todos os Macs)
    runs-on: macos-14
    timeout-minutes: 55
    defaults:
      run:
        working-directory: AlphaCompareApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Garantir Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Python x86_64 (Miniforge, p/ congelar o OCR em x64)
        run: |
          curl -L -o /tmp/mf.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-x86_64.sh
          bash /tmp/mf.sh -b -p "$HOME/mf-x64"
          # ambiente x64 com Python 3.12 (IGUAL ao Windows) — o base do Miniforge pode vir 3.13,
          # e aí o pip resolve um rapidocr ANTIGO (ch_ppocr_v3_det, import dinamico) que quebra congelado.
          arch -x86_64 "$HOME/mf-x64/bin/conda" create -y -n b python=3.12

      - name: Congelar o OCR em x64 (via Rosetta, Python 3.12 + rapidocr 1.4.4)
        run: |
          PY="$HOME/mf-x64/envs/b/bin/python"
          # PIN rapidocr-onnxruntime==1.4.4: usa import ESTATICO (ch_ppocr_det) que o PyInstaller
          # bundla certo. Versoes antigas carregam o detector por caminho -> "has no attribute TextDetector".
          arch -x86_64 "$PY" -m pip install --upgrade pip pyinstaller "rapidocr-onnxruntime==1.4.4"
          arch -x86_64 "$PY" -m PyInstaller --noconfirm --onedir --console --name ocr_server \
            --collect-data rapidocr_onnxruntime \
            --collect-all onnxruntime \
            --collect-all cv2 \
            --exclude-module PyQt6 --exclude-module PySide6 --exclude-module PyQt5 \
            --exclude-module pandas --exclude-module matplotlib --exclude-module scipy \
            --exclude-module tkinter --exclude-module IPython --exclude-module notebook \
            --distpath build/ocr_dist --workpath build/pyi_work --specpath build/pyi_spec \
            src/ocr/ocr_server.py

      - name: Conferir arquitetura do OCR (tem que ser x86_64)
        run: file build/ocr_dist/ocr_server/ocr_server

      - name: Congelar o RENDER NATIVO (pdfium via pypdfium2) em x64
        run: |
          PY="$HOME/mf-x64/envs/b/bin/python"
          arch -x86_64 "$PY" -m pip install pypdfium2 numpy
          arch -x86_64 "$PY" -m PyInstaller --noconfirm --onedir --console --name render_server \
            --collect-all pypdfium2 --collect-all pypdfium2_raw \
            --exclude-module PyQt6 --exclude-module PySide6 --exclude-module PyQt5 \
            --exclude-module pandas --exclude-module matplotlib --exclude-module scipy \
            --exclude-module tkinter --exclude-module IPython --exclude-module notebook \
            --distpath build/ocr_dist --workpath build/pyi_work_r --specpath build/pyi_spec_r \
            src/render/render_server.py

      - name: Conferir arquitetura do render (tem que ser x86_64)
        run: file build/ocr_dist/render_server/render_server

      - name: Dependências do app (Electron)
        run: npm install

      - name: Empacotar o .dmg x64 (sem assinatura Apple)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64

      - name: Publicar o .dmg como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AlphaCompare-mac
          path: AlphaCompareApp/dist/*.dmg
          if-no-files-found: error
          # o .dmg tambem vai pra Release (permanente e NAO conta no storage). O artefato serve so
          # pra baixar logo apos o build -> retencao curta evita encher o Actions storage (0.5GB).
          retention-days: 2

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o artefato
        uses: actions/download-artifact@v4
        with:
          path: dmgs

      - name: Criar/atualizar a Release com o .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find dmgs -name '*.dmg')
          echo "Arquivos: $FILES"
          gh release create "${{ github.ref_name }}" $FILES \
            --repo "${{ github.repository }}" \
            --title "Alpha Compare Mac ${{ github.ref_name }}" \
            --notes "Instalador .dmg (x64) do Alpha Compare para macOS — roda em todos os Macs (Intel nativo + Apple Silicon via Rosetta). Não assinado pela Apple: na 1ª abertura, clique com o botão direito no app > Abrir." \
          || gh release upload "${{ github.ref_name }}" $FILES --repo "${{ github.repository }}" --clobber
