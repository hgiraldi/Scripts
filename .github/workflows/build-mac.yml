# Gera o instalável .dmg do Alpha Compare NA NUVEM (runners macOS do GitHub) — sem precisar de
# um Mac físico. Cada arquitetura (Apple Silicon arm64 + Intel x64) congela o próprio OCR e
# empacota seu .dmg. Dispara: manual (botão "Run workflow") OU push de uma tag "mac-v*".
name: Build Mac DMG

on:
  workflow_dispatch:          # botão manual (aparece quando o workflow está na branch padrão)
  push:
    tags:
      - 'mac-v*'              # ex.: git tag mac-v1 && git push origin mac-v1

jobs:
  build:
    name: DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 (Intel): roda NATIVO nos Macs Intel (2014/2018) E nos Apple Silicon via Rosetta.
          # Um .dmg só que funciona em TODOS os Macs.
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: AlphaCompareApp
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências do OCR (PyInstaller + RapidOCR)
        run: pip3 install --upgrade pip pyinstaller rapidocr-onnxruntime

      - name: Congelar o OCR (binário do Mac)
        run: |
          python3 -m PyInstaller --noconfirm --onedir --console --name ocr_server \
            --collect-data rapidocr_onnxruntime \
            --collect-all onnxruntime \
            --collect-all cv2 \
            --exclude-module PyQt6 --exclude-module PySide6 --exclude-module PyQt5 \
            --exclude-module pandas --exclude-module matplotlib --exclude-module scipy \
            --exclude-module tkinter --exclude-module IPython --exclude-module notebook \
            --distpath build/ocr_dist --workpath build/pyi_work --specpath build/pyi_spec \
            src/ocr/ocr_server.py

      - name: Dependências do app (Electron)
        run: npm install

      - name: Empacotar o .dmg (sem assinatura Apple)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # sem certificado Apple -> .dmg não assinado
        run: npm run dist:mac

      - name: Publicar o .dmg como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AlphaCompare-mac-${{ matrix.arch }}
          path: AlphaCompareApp/dist/*.dmg
          if-no-files-found: error

  release:
    # Junta os 2 .dmg numa Release do GitHub (link de download direto). Só quando dispara por tag.
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar os artefatos (arm64 + x64)
        uses: actions/download-artifact@v4
        with:
          path: dmgs

      - name: Criar/atualizar a Release com os .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find dmgs -name '*.dmg')
          echo "Arquivos: $FILES"
          gh release create "${{ github.ref_name }}" $FILES \
            --repo "${{ github.repository }}" \
            --title "Alpha Compare Mac ${{ github.ref_name }}" \
            --notes "Instaladores .dmg do Alpha Compare para macOS (Apple Silicon arm64 e Intel x64). Não assinado pela Apple: na 1ª abertura, clique com o botão direito no app > Abrir." \
          || gh release upload "${{ github.ref_name }}" $FILES --repo "${{ github.repository }}" --clobber
