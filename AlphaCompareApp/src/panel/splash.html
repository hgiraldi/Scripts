<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default; }
  .card {
    position: absolute; inset: 10px; border-radius: 20px;
    background: linear-gradient(135deg, #12233b 0%, #1b3355 100%);
    box-shadow: 0 18px 50px rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: fadein .35s ease-out;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .logo { width: 104px; height: auto; filter: brightness(0) invert(1);
    margin-bottom: 20px; animation: pulse 1.9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  h1 { margin: 0; color: #fff; font-size: 23px; font-weight: 800; letter-spacing: 1.5px; }
  p  { margin: 7px 0 0; color: #9fb2cc; font-size: 13px; }
  .bar { margin-top: 24px; width: 190px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.12); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 42%; border-radius: 4px;
    background: linear-gradient(90deg, #12c8e6, #1f6fe0); animation: slide 1.25s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
  .st { position: absolute; bottom: 30px; color: #7d90ad; font-size: 12px; letter-spacing: .3px; }
  .v  { position: absolute; bottom: 13px; color: #55688a; font-size: 10.5px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./img/logo_alphacompare.png" onerror="this.style.display='none'">
    <h1>ALPHA COMPARE</h1>
    <p>Conferência visual · original × arquivo</p>
    <div class="bar"><i></i></div>
    <div class="st">carregando o aplicativo…</div>
    <div class="v">Alpha Clicheria</div>
  </div>
</body>
</html>
